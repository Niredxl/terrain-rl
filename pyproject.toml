[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrain-rl"
version = "0.2.0"
description = "Procedural and learned terrain generators for reinforcement learning"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pybullet>=3.2",
    "stable-baselines3>=2.2",
    "torch>=2.1",
    "wandb>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
terrain-ppo = "terrain_rl.scripts.train_ppo:main"
terrain-demo = "terrain_rl.scripts.demo:main"
